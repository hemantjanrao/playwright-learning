name: Configure test environment
description: Apply CI env vars with demo-safe URL defaults. Credentials come only from E2E_USERNAME / E2E_PASSWORD secrets passed via env on the calling step.

runs:
  using: composite
  steps:
    - name: Export test environment variables
      shell: bash
      run: |
        {
          echo "BASE_URL=${BASE_URL:-https://practicesoftwaretesting.com}"
          echo "API_BASE_URL=${API_BASE_URL:-https://jsonplaceholder.typicode.com}"
          echo "E2E_USERNAME=${E2E_USERNAME}"
          echo "E2E_PASSWORD=${E2E_PASSWORD}"
        } >> "$GITHUB_ENV"
