# Toolshop (practice-software-testing sprint5) for CI UI tests.
# Public site is behind Cloudflare bot protection, which blocks CI runners.
# UI: http://localhost:4200 · API: http://localhost:8091
# Seed after start: docker compose -f docker/toolshop/docker-compose.yml exec -T laravel-api php artisan migrate:fresh --seed --force
name: toolshop
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  # testsmith/practice-software-testing-web is arm64-only; CI runners are amd64.
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
